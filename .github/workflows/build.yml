name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Unzip project
        run: |
          unzip -o yaounde-delices-mobile.zip -d .
          ls -la

      - name: Install dependencies
        run: |
          cd yaounde-delices
          npm install

      - name: Build React app
        run: |
          cd yaounde-delices
          npm run build

      - name: Setup Capacitor
        run: |
          cd yaounde-delices
          npx cap init YaoundeDelices com.yaounde.delices
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd yaounde-delices
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: yaounde-delices/android/app/build/outputs/apk/debug/app-debug.apk
