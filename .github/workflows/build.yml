name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP archive
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          unzip yaounde-delices-mobile.zip
          ls -la

      - name: Find project directory
        id: find-project
        run: |
          PROJECT_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "./.github/*" | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found project at: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: npm install

      - name: Build React app
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ steps.find-project.outputs.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find-project.outputs.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
